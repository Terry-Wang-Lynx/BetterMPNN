# BetterMPNN — Large-scale Sampling example (frozen MPNN, no RL update)
#
# Sampling mode runs a frozen ProteinMPNN, evaluates every AF3 seed per
# variant, and applies structural filters (iPTM / pTM / PAE) to build a
# screening pool of candidates for downstream experimental validation.
# Parallelize across GPUs with scripts/run_sample_array.sh.
#
# This example reuses the bundled GZMK binder scaffold (same as example.yaml).

mode: "sample"

# --- Input scaffold (target + binder complex) ---
pdb: "examples/scaffold.pdb"
chain: "A"                            # redesign the binder chain

# --- Design scope (optional) ---
# Only redesign these residues; everything else stays fixed.
# Omit or leave empty to redesign the whole chain.
design:
  redesign_residues: []               # e.g. ["A10", "A11", "A16"]

# --- ProteinMPNN ---
mpnn_weights: "weights/vanilla/v_48_020.pt"

# --- Sampling parameters ---
steps: 100                            # sampling rounds (split across array tasks)
variants: 8                           # sequences per step
temperature: 0.3
num_seeds: 10                         # AF3 seeds evaluated per variant
seed: 0                               # RNG seed for reproducible sampling

# Delete AF3 prediction files after extracting results (saves disk on long runs)
cleanup_predictions: true

# --- Output ---
output_dir: "output_sampling"

# --- Filtering criteria (structural; protein-protein binder) ---
filter:
  iptm_min: 0.8             # keep variants with strong predicted interface
  ptm_min: 0.0
  pae_max: 31.75
  # RMSD / decoy thresholds below only apply if you provide reference
  # structures (open_ref_pdb/closed_ref_pdb) or decoy_smiles — for a plain
  # binder they are inactive.

# --- Environment ---
environment:
  type: "alphafold3"
  af3_sif: "/path/to/alphafold3.sif"
  af3_run_dir: "/path/to/alphafold3"
  af3_model_dir: "/path/to/alphafold3/model"
  af3_db_dir: "/path/to/alphafold3/dataset"
  apptainer_path: "auto"
  template_json: "configs/af3_template.json"
  run_data_pipeline: false
  design_chain_index: 0      # binder (chain A) is sequences[0] in the template
  reward_weights:
    iptm: 0.55
    ptm: 0.05
    pae: 0.4
    clash_penalty: 0.1
