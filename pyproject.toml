[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bettermpnn"
version = "0.1.0"
description = "GRPO-based reinforcement learning for protein sequence optimization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.23",
    "biopython>=1.80",
    "biotite>=0.39",
    "matplotlib>=3.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
bettermpnn = "bettermpnn.cli:main"

[tool.setuptools.packages.find]
include = ["bettermpnn*"]

[tool.setuptools.package-data]
bettermpnn = ["mpnn/*.py"]
